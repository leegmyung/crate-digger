<style>
  /* 시안 A — 야구 기록 사이트(Baseball Savant·FBref)처럼: 촘촘한 숫자, 항목마다 0~100 백분위 막대.
     색은 '강함' 한 가지(벽돌색)만, 약할수록 회색으로 섞인다. 그림자·그라데이션·알약 배지 없음. */
  :root {
    --bg: #fbfbfa; --panel: #ffffff; --ink: #161616; --muted: #5c5c5c; --faint: #8a8a8a;
    --line: #e2e1de; --line-strong: #c9c7c2; --row-hover: #f3f2ef; --row-on: #efece6;
    --hot: #b23a1f; --cold: #c8c6c1; --track: #ecebe8; --circle-ink: #ffffff;
    --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  [data-theme="dark"] {
    --bg: #0e0e0e; --panel: #151515; --ink: #ecebe8; --muted: #a8a6a1; --faint: #77756f;
    --line: #262625; --line-strong: #3a3937; --row-hover: #1c1c1b; --row-on: #23211f;
    --hot: #f0714f; --cold: #4a4846; --track: #232322; --circle-ink: #111111;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  header.top { display: flex; align-items: center; gap: 16px; padding: 10px 20px; border-bottom: 2px solid var(--ink); background: var(--panel); }
  .brand { font-weight: 700; letter-spacing: .02em; font-size: 14px; }
  .brand small { font-weight: 500; color: var(--muted); margin-left: 8px; font-size: 12px; }
  .top .meta { color: var(--muted); font-size: 12px; }
  .top .spacer { flex: 1; }
  .btn { font: 500 12px var(--sans); color: var(--ink); background: transparent; border: 1px solid var(--line-strong); border-radius: 2px; padding: 4px 10px; cursor: pointer; text-decoration: none; }
  .btn:hover { background: var(--row-hover); }

  main { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(320px, 1fr); min-height: calc(100vh - 46px); }
  section.board { padding: 16px 20px 24px; border-right: 1px solid var(--line); overflow-x: auto; }
  aside.detail { padding: 16px 20px 24px; background: var(--panel); min-width: 0; }
  h2.sec { font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; }
  .caption { color: var(--muted); font-size: 12px; margin: 0 0 10px; }

  table { width: 100%; border-collapse: collapse; }
  thead th { font-size: 11px; font-weight: 600; color: var(--muted); text-align: left; padding: 6px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
  thead th.r, td.r { text-align: right; }
  tbody tr { cursor: pointer; }
  tbody tr:nth-child(even) { background: color-mix(in srgb, var(--track) 45%, transparent); }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr[aria-selected="true"] { background: var(--row-on); box-shadow: inset 3px 0 0 var(--hot); }
  tbody tr:focus-visible { outline: 2px solid var(--hot); outline-offset: -2px; }
  td { padding: 5px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
  td.rank { color: var(--faint); width: 28px; }
  td.team b { font-weight: 600; }
  td.team span { color: var(--faint); margin-left: 6px; font-size: 11.5px; }
  td.score { font-weight: 600; }
  .mini { display: inline-flex; align-items: center; gap: 4px; }
  .mini i { display: block; width: 34px; height: 6px; background: var(--track); position: relative; }
  .mini i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--c); }
  .mini em { font-style: normal; font-size: 11px; color: var(--muted); width: 18px; text-align: right; }

  .d-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; border-bottom: 1px solid var(--line-strong); padding-bottom: 12px; }
  .d-name { font-size: 22px; font-weight: 700; margin: 0; line-height: 1.2; }
  .d-sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .d-score { text-align: right; }
  .d-score .big { font: 600 30px/1 var(--mono); }
  .d-score .pct { color: var(--muted); font-size: 11.5px; margin-top: 4px; white-space: nowrap; }
  .facts { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); margin: 0; }
  .facts div { padding: 8px 0; }
  .facts dt { color: var(--muted); font-size: 11px; }
  .facts dd { margin: 2px 0 0; font: 600 15px var(--mono); }

  .pct-list { margin: 14px 0 6px; }
  .pct-row, .scale { display: grid; grid-template-columns: 112px 52px minmax(0, 1fr) 44px; align-items: center; gap: 10px; }
  .pct-row { padding: 6px 0; border-bottom: 1px dotted var(--line); }
  .pct-row .lab { font-weight: 500; }
  .pct-row .raw { color: var(--muted); font-size: 12px; }
  .pct-row .pts { text-align: right; color: var(--muted); font-size: 12px; }
  .bar { position: relative; height: 10px; background: var(--track); margin: 0 12px; }
  .bar .fill { position: absolute; inset: 0 auto 0 0; background: var(--c); }
  .bar .dot { position: absolute; top: 50%; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; background: var(--c); color: var(--circle-ink); font: 600 11px/24px var(--mono); text-align: center; }
  .scale { color: var(--faint); font-size: 10.5px; }
  .scale .ticks { display: flex; justify-content: space-between; margin: 0 12px; }

  table.events td { font-size: 12px; padding: 4px 6px; }
  table.events td.d { color: var(--muted); width: 84px; }
  table.events td.b { color: var(--muted); width: 64px; }
  td.ev { white-space: normal; }
  .note { color: var(--faint); font-size: 11.5px; margin-top: 14px; }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    section.board { border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; }
    aside.detail { padding: 14px 16px 28px; }
    header.top { flex-wrap: wrap; padding: 10px 16px; gap: 8px 12px; }
    .top .meta { order: 3; width: 100%; }
    th.hide-s, td.hide-s { display: none; }
  }
  @media (max-width: 480px) {
    .pct-row, .scale { grid-template-columns: 84px 40px minmax(0, 1fr) 36px; gap: 6px; }
    .facts { grid-template-columns: repeat(2, 1fr); }
    .d-name { font-size: 19px; }
    td.team span { display: none; }
  }
</style>

<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("mock-data").textContent || "{}");
  var teams = DATA.teams || [];
  var comps = DATA.components || [];
  var selected = 0;

  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "text") el.textContent = attrs[k];
      else el.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) el.appendChild(c); });
    return el;
  }
  function tone(p) { return "color-mix(in srgb, var(--hot) " + Math.max(18, p) + "%, var(--cold))"; }
  function fmt(n) { return Number(n).toFixed(2); }
  function comma(n) { return Number(n).toLocaleString("ko-KR"); }
  function fact(k, v) { return h("div", {}, [h("dt", { text: k }), h("dd", { text: v })]); }

  function renderRows() {
    var body = document.getElementById("rows");
    body.textContent = "";
    teams.forEach(function (t, i) {
      var cells = [
        h("td", { class: "rank num", text: String(t.rank) }),
        h("td", { class: "team" }, [h("b", { text: t.name }), t.genre ? h("span", { text: t.genre }) : null]),
        h("td", { class: "score r num", text: fmt(t.score) })
      ];
      t.parts.forEach(function (p) {
        cells.push(h("td", { class: "hide-s" }, [h("span", { class: "mini" }, [
          h("i", { style: "--w:" + p.pct + "%;--c:" + tone(p.pct) }),
          h("em", { class: "num", text: p.pct ? String(p.pct) : "–" })
        ])]));
      });
      cells.push(h("td", { class: "r num hide-s", text: t.last_seen || "" }));
      var tr = h("tr", { tabindex: "0", "aria-selected": i === selected ? "true" : "false" }, cells);
      tr.addEventListener("click", function () { select(i, true); });
      tr.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(i, true); }
        if (e.key === "ArrowDown" && i < teams.length - 1) { e.preventDefault(); select(i + 1, false); body.children[i + 1].focus(); }
        if (e.key === "ArrowUp" && i > 0) { e.preventDefault(); select(i - 1, false); body.children[i - 1].focus(); }
      });
      body.appendChild(tr);
    });
  }

  function renderDetail() {
    var box = document.getElementById("detail");
    box.textContent = "";
    var t = teams[selected];
    if (!t) { box.appendChild(h("p", { class: "note", text: "데이터가 없습니다. scripts/build_design_mocks.py 를 실행하세요." })); return; }
    var sub = [t.genre, t.status, t.first_release ? "첫 발매 " + t.first_release : "", "첫 포착 " + t.first_seen].filter(Boolean).join(" · ");
    box.appendChild(h("div", { class: "d-head" }, [
      h("div", {}, [h("h2", { class: "d-name", text: t.name }), h("div", { class: "d-sub", text: sub })]),
      h("div", { class: "d-score" }, [
        h("div", { class: "big", text: fmt(t.score) }),
        h("div", { class: "pct", text: "후보 " + t.rank + "위 · 백분위 " + t.score_pct })
      ])
    ]));
    var f = t.facts;
    box.appendChild(h("dl", { class: "facts" }, [
      fact("최근 1년 공연", f.gigs_1y + "회"), fact("공연장", f.venues + "곳"),
      fact("최근 180일 신호", f.recent180 + "건"), fact("갈래", f.n_branch + "/4")
    ]));
    box.appendChild(h("h2", { class: "sec", style: "margin-top:16px", text: "점수 근거 · 백분위" }));
    box.appendChild(h("p", { class: "caption", text: "비교 대상: " + DATA.as_of + " 기준 후보 풀 " + comma(DATA.pool_size) + "팀 (정답 아직 없는 팀). 오른쪽 숫자 = 점수에 더해진 값." }));
    var list = h("div", { class: "pct-list" });
    t.parts.forEach(function (p, k) {
      var c = comps[k] || { label: p.key, desc: "" };
      list.appendChild(h("div", { class: "pct-row", title: c.desc }, [
        h("span", { class: "lab", text: c.label }),
        h("span", { class: "raw", text: p.raw }),
        h("div", { class: "bar", style: "--c:" + tone(p.pct) }, [
          h("div", { class: "fill", style: "width:" + p.pct + "%" }),
          h("div", { class: "dot", style: "left:" + p.pct + "%", text: String(p.pct) })
        ]),
        h("span", { class: "pts num", text: "+" + fmt(p.pts) })
      ]));
    });
    box.appendChild(list);
    box.appendChild(h("div", { class: "scale" }, [h("span"), h("span"),
      h("span", { class: "ticks" }, [h("span", { text: "0" }), h("span", { text: "50" }), h("span", { text: "100" })]), h("span")]));
    box.appendChild(h("h2", { class: "sec", style: "margin-top:20px", text: "최근 활동" }));
    var rows = (t.events || []).map(function (e) {
      return h("tr", {}, [h("td", { class: "d num", text: e.date }), h("td", { class: "b", text: e.branch }), h("td", { class: "ev", text: e.label })]);
    });
    box.appendChild(h("table", { class: "events" }, [h("tbody", {}, rows)]));
    box.appendChild(h("p", { class: "note", text: "시안용 화면 — 실제 데이터(" + DATA.as_of + " 스냅샷 순서)로 그렸고 버튼·필터는 동작하지 않습니다." }));
  }

  function select(i, scroll) {
    selected = i;
    Array.prototype.forEach.call(document.getElementById("rows").children, function (tr, k) {
      tr.setAttribute("aria-selected", k === i ? "true" : "false");
    });
    renderDetail();
    if (scroll && window.matchMedia("(max-width: 900px)").matches) {
      document.getElementById("detail").scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }

  var themeBtn = document.getElementById("theme");
  function themeLabel() { themeBtn.textContent = document.documentElement.getAttribute("data-theme") === "dark" ? "화이트 모드" : "블랙 모드"; }
  themeBtn.addEventListener("click", function () {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("gigle-mock-theme", next); } catch (e) { /* 저장 못 해도 화면은 바뀜 */ }
    themeLabel();
  });
  themeLabel();
  document.getElementById("meta").textContent = DATA.as_of ? "기준일 " + DATA.as_of + " · 후보 풀 " + comma(DATA.pool_size) + "팀 · 점수 v2" : "";
  renderRows();
  renderDetail();
})();
</script>
