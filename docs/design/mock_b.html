  :root {
    --bg: #ffffff; --side: #f7f7f6; --ink: #1b1b1a; --muted: #6b6b68; --faint: #9a9a96;
    --line: #ececea; --line-2: #dcdcd9; --hover: #f6f6f5; --on: #f2f1ef;
    --accent: #c2531c; --accent-soft: color-mix(in srgb, var(--accent) 13%, transparent);
    --font: Inter, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  }
  [data-theme="dark"] {
    --bg: #0c0c0d; --side: #09090a; --ink: #e8e8e6; --muted: #9b9b97; --faint: #6c6c69;
    --line: #1d1d1f; --line-2: #2a2a2c; --hover: #141416; --on: #18181a;
    --accent: #ef8a54; --accent-soft: color-mix(in srgb, var(--accent) 16%, transparent);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 13.5px/1.5 var(--font); font-feature-settings: "tnum" 1, "cv11" 1; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .app { display: grid; grid-template-columns: 208px minmax(0, 1fr) minmax(320px, 400px); min-height: 100vh; }

  nav.side { background: var(--side); border-right: 1px solid var(--line); padding: 14px 10px; color: var(--muted); }
  .ws { display: flex; align-items: center; gap: 8px; padding: 4px 8px 14px; color: var(--ink); font-weight: 600; font-size: 13px; }
  .ws i { width: 18px; height: 18px; border-radius: 4px; background: var(--ink); color: var(--bg); font: 600 11px/18px var(--font); text-align: center; font-style: normal; }
  .side a { display: flex; justify-content: space-between; padding: 5px 8px; border-radius: 4px; font-size: 13px; }
  .side a:hover { background: var(--hover); color: var(--ink); }
  .side a.on { background: var(--on); color: var(--ink); font-weight: 500; }
  .side a span { color: var(--faint); font-size: 12px; }
  .side .grp { font-size: 11.5px; color: var(--faint); padding: 16px 8px 4px; }

  section.main { min-width: 0; display: flex; flex-direction: column; }
  .bar-top { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 18px; border-bottom: 1px solid var(--line); }

  .bar-top .crumb { color: var(--faint); font-size: 13px; }
  .bar-top .sp { flex: 1; }
  .ghost { font: 500 12.5px var(--font); color: var(--muted); background: none; border: 1px solid var(--line-2); border-radius: 5px; padding: 4px 10px; cursor: pointer; }

  .filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
  .tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line-2); border-radius: 4px; padding: 2px 8px; }
  .tag b { color: var(--ink); font-weight: 500; }

  .list { padding: 4px 0 24px; overflow-x: auto; }
  .head, .row { display: grid; grid-template-columns: 34px minmax(140px, 1fr) 150px 56px 64px 92px; align-items: center; gap: 12px; padding: 0 18px; }
  .head { height: 32px; color: var(--faint); font-size: 12px; border-bottom: 1px solid var(--line); }
  .row { height: 42px; border-bottom: 1px solid var(--line); cursor: pointer; position: relative; }
  .row:hover { background: var(--hover); }
  .row[aria-selected="true"] { background: var(--on); }

  .row:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
  .rk { color: var(--faint); font-size: 12.5px; }
  .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nm b { font-weight: 500; }
  .nm span { color: var(--faint); margin-left: 8px; font-size: 12.5px; }
  .sc { position: relative; height: 24px; display: flex; align-items: center; }
  .sc i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent-soft); border-radius: 2px; }
  .sc em { position: relative; font-style: normal; padding-left: 8px; font-weight: 500; }
  .r { text-align: right; }
  .dim { color: var(--muted); }

  aside.pane { border-left: 1px solid var(--line); min-width: 0; }
  .pane-in { position: sticky; top: 0; padding: 0 22px 28px; max-height: 100vh; overflow-y: auto; }
  .pane-top { height: 46px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); margin: 0 -22px 18px; padding: 0 22px; color: var(--faint); font-size: 12.5px; }
  .p-name { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .p-meta { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .p-score { display: flex; align-items: baseline; gap: 8px; margin: 16px 0 4px; }
  .p-score b { font-size: 28px; font-weight: 600; letter-spacing: -.02em; }
  .p-score span { color: var(--muted); font-size: 12.5px; }
  ul.why { list-style: none; padding: 0; margin: 10px 0 0; }
  ul.why li { padding: 3px 0 3px 14px; position: relative; }
  ul.why li::before { content: ""; position: absolute; left: 2px; top: 11px; width: 5px; height: 1px; background: var(--muted); }
  h3 { font-size: 12px; font-weight: 500; color: var(--faint); margin: 24px 0 8px; }
  .part { display: grid; grid-template-columns: minmax(0, 1fr) 54px 44px; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .part .lb { min-width: 0; }
  .part .lb small { display: block; color: var(--faint); font-size: 11.5px; }
  .part .track { height: 3px; background: var(--line-2); position: relative; }
  .part .track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }
  .part .zero .track i { display: none; }
  .part.zero { color: var(--faint); }
  .ev { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 10px; padding: 5px 0; font-size: 12.5px; }
  .ev time { white-space: nowrap; }
  .ev time { color: var(--faint); }
  .ev span small { color: var(--faint); margin-right: 6px; }
  .keys { color: var(--faint); font-size: 11.5px; margin-top: 22px; }
  kbd { font: 11px var(--font); border: 1px solid var(--line-2); border-radius: 3px; padding: 0 4px; }

  @media (max-width: 1100px) {
    .app { grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); }
    nav.side { display: none; }
  }
  @media (max-width: 780px) {
    .app { grid-template-columns: 1fr; }
    aside.pane { border-left: 0; border-top: 1px solid var(--line); }
    .pane-in { position: static; max-height: none; padding: 0 16px 28px; }
    .pane-top { margin: 0 -16px 16px; padding: 0 16px; }
    .bar-top, .filters { padding-left: 16px; padding-right: 16px; }
    .head, .row { grid-template-columns: 26px minmax(0, 1fr) 96px; padding: 0 16px; gap: 10px; }
    .hide-s { display: none; }
  }

<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("mock-data").textContent || "{}");
  var teams = DATA.teams || [];
  var comps = DATA.components || [];
  var selected = 0;
  var maxScore = teams.reduce(function (m, t) { return Math.max(m, t.score); }, 0) || 1;

  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "text") el.textContent = attrs[k];
      else el.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) el.appendChild(c); });
    return el;
  }
  function fmt(n) { return Number(n).toFixed(2); }
  function comma(n) { return Number(n).toLocaleString("ko-KR"); }

  function renderFilters() {
    var box = document.getElementById("filters");
    [["기준일", DATA.as_of], ["점수", "v2"], ["정답", "아직 없는 팀"], ["후보 풀", comma(DATA.pool_size || 0) + "팀"]].forEach(function (f) {
      box.appendChild(h("span", { class: "tag" }, [document.createTextNode(f[0] + " "), h("b", { text: f[1] || "" })]));
    });
    document.getElementById("nav-count").textContent = comma(DATA.pool_size || 0);
  }

  function renderRows() {
    var box = document.getElementById("rows");
    teams.forEach(function (t, i) {
      var row = h("div", { class: "row", role: "option", tabindex: "0", "aria-selected": i === selected ? "true" : "false" }, [
        h("span", { class: "rk", text: String(t.rank) }),
        h("span", { class: "nm" }, [h("b", { text: t.name }), t.genre ? h("span", { text: t.genre }) : null]),
        h("span", { class: "sc" }, [h("i", { style: "width:" + Math.round(100 * t.score / maxScore) + "%" }), h("em", { text: fmt(t.score) })]),
        h("span", { class: "r dim hide-s", text: t.facts.n_branch + "/4" }),
        h("span", { class: "r dim hide-s", text: t.facts.venues + "곳" }),
        h("span", { class: "r dim hide-s", text: (t.last_seen || "").slice(2).replace(/-/g, ".") })
      ]);
      row.addEventListener("click", function () { select(i, true); });
      row.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(i, true); }
        if (e.key === "ArrowDown" && i < teams.length - 1) { e.preventDefault(); select(i + 1, false); box.children[i + 1].focus(); }
        if (e.key === "ArrowUp" && i > 0) { e.preventDefault(); select(i - 1, false); box.children[i - 1].focus(); }
      });
      box.appendChild(row);
    });
  }

  function renderPane() {
    var pane = document.getElementById("pane");
    pane.textContent = "";
    var t = teams[selected];
    pane.appendChild(h("div", { class: "pane-top" }, [h("span", { text: t ? "후보 " + t.rank + " / " + teams.length : "" }), h("span", { text: "팀 상세" })]));
    if (!t) { pane.appendChild(h("p", { class: "dim", text: "데이터가 없습니다. scripts/build_design_mocks.py 를 실행하세요." })); return; }
    var meta = [t.genre, t.status, t.first_release ? "첫 발매 " + t.first_release : "첫 포착 " + t.first_seen].filter(Boolean).join(" · ");
    pane.appendChild(h("h2", { class: "p-name", text: t.name }));
    pane.appendChild(h("div", { class: "p-meta", text: meta }));
    pane.appendChild(h("div", { class: "p-score" }, [h("b", { text: fmt(t.score) }), h("span", { text: "점 · 후보 풀 " + comma(DATA.pool_size) + "팀 중 " + t.rank + "위" })]));
    pane.appendChild(h("ul", { class: "why" }, (t.clauses || []).map(function (c) { return h("li", { text: c }); })));

    pane.appendChild(h("h3", { text: "점수 근거 — 막대는 이 팀 점수에서 차지하는 몫" }));
    t.parts.forEach(function (p, k) {
      var c = comps[k] || { label: p.key, desc: "" };
      var share = t.score ? Math.round(100 * p.pts / t.score) : 0;
      pane.appendChild(h("div", { class: "part" + (p.pts ? "" : " zero"), title: c.desc }, [
        h("div", { class: "lb" }, [document.createTextNode(c.label), h("small", { text: p.raw })]),
        h("div", { class: "track" }, [h("i", { style: "width:" + share + "%" })]),
        h("div", { class: "r", text: p.pts ? "+" + fmt(p.pts) : "—" })
      ]));
    });

    pane.appendChild(h("h3", { text: "최근 활동" }));
    (t.events || []).forEach(function (e) {
      pane.appendChild(h("div", { class: "ev" }, [h("time", { text: e.date }), h("span", {}, [h("small", { text: e.branch }), document.createTextNode(e.label)])]));
    });
    pane.appendChild(h("p", { class: "keys" }, [h("kbd", { text: "↑" }), document.createTextNode(" "), h("kbd", { text: "↓" }), document.createTextNode(" 다음 팀  ·  시안용 화면, 메뉴·필터는 동작하지 않음")]));
  }

  function select(i, scroll) {
    selected = i;
    Array.prototype.forEach.call(document.getElementById("rows").children, function (r, k) {
      r.setAttribute("aria-selected", k === i ? "true" : "false");
    });
    renderPane();
    if (scroll && window.matchMedia("(max-width: 780px)").matches) {
      document.getElementById("pane-wrap").scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }

  var themeBtn = document.getElementById("theme");
  function themeLabel() { themeBtn.textContent = document.documentElement.getAttribute("data-theme") === "dark" ? "화이트 모드" : "블랙 모드"; }
  themeBtn.addEventListener("click", function () {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("gigle-mock-theme", next); } catch (e) { /* 저장 못 해도 화면은 바뀜 */ }
    themeLabel();
  });
  themeLabel();
  renderFilters();
  renderRows();
  renderPane();
})();
</script>
