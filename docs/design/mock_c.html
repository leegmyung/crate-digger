  :root {

  article.story { border-left: 1px solid var(--rule); padding-left: 44px; min-width: 0; }
  .kicker { font-size: 12.5px; color: var(--red); letter-spacing: .03em; }

  .leaders { margin: 0; padding: 0; list-style: none; }

  .leaders li .lb small { color: var(--faint); margin-left: 6px; font-size: 12px; }
  .leaders li .dots { flex: 1; border-bottom: 1px dotted var(--faint); transform: translateY(-4px); min-width: 20px; }
  .leaders li .v { font-variant-numeric: tabular-nums; }
  .leaders li.off { color: var(--faint); }
  .leaders li.total { border-top: 1px solid var(--rule-strong); margin-top: 6px; padding-top: 8px; font-weight: 700; }
  .chrono { list-style: none; margin: 0; padding: 0; }

  .chrono time { font: 700 15px var(--serif); font-variant-numeric: tabular-nums; }
  .chrono span small { display: block; color: var(--faint); font-size: 12px; }

  @media (max-width: 900px) {

<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("mock-data").textContent || "{}");
  var teams = DATA.teams || [];
  var comps = DATA.components || [];
  var selected = 0;

  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "text") el.textContent = attrs[k];
      else el.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) el.appendChild(c); });
    return el;
  }
  function fmt(n) { return Number(n).toFixed(2); }
  function comma(n) { return Number(n).toLocaleString("ko-KR"); }
  function longDate(iso) {
    var p = (iso || "").split("-");
    return p.length === 3 ? p[0] + "년 " + Number(p[1]) + "월 " + Number(p[2]) + "일" : "";
  }

  /* 점수 근거를 기사 문장으로. 숫자는 그대로, 말투만 바꾼다. */
  function sentences(t) {
    var f = t.facts, s = [];
    if (f.gigs_1y && f.venues) s.push("최근 1년 동안 " + f.gigs_1y + "번 무대에 올랐고, 서로 다른 공연장 " + f.venues + "곳을 거쳤다");
    else if (f.gigs_1y) s.push("최근 1년 동안 " + f.gigs_1y + "번 무대에 올랐다");
    else if (f.venues) s.push("지금까지 서로 다른 공연장 " + f.venues + "곳에 섰다");
    if (f.best_stage) s.push("선정·지원 프로그램에서는 " + f.best_stage + "단계까지 올라갔다");
    if (f.peer_winner) s.push("이미 상을 받은 팀과 같은 무대에 선 기록도 있다");
    if (f.outlets && f.context_outlets) s.push("발굴형 매체 " + f.outlets + "곳과 맥락 매체 " + f.context_outlets + "곳이 이 팀을 다뤘다");
    else if (f.outlets) s.push("발굴형 매체 " + f.outlets + "곳이 이 팀을 다뤘다");
    else if (f.context_outlets) s.push("매체 " + f.context_outlets + "곳이 이 팀을 다뤘다");
    if (!s.length) return [];
    s[0] = t.name + t.particle + " " + s[0];
    return s.map(function (x) { return x + "."; });
  }

  function renderChart() {
    var ol = document.getElementById("chart");
    teams.forEach(function (t, i) {
      var li = h("li", { tabindex: "0", "aria-selected": i === selected ? "true" : "false" }, [
        h("span", { class: "no", text: String(t.rank) }),
        h("span", { class: "who", text: t.name }),
        h("span", { class: "pts", text: fmt(t.score) }),
        h("span", { class: "line", text: (t.clauses || []).join(" · ") || t.genre })
      ]);
      li.addEventListener("click", function () { select(i, true); });
      li.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(i, true); }
        if (e.key === "ArrowDown" && i < teams.length - 1) { e.preventDefault(); select(i + 1, false); ol.children[i + 1].focus(); }
        if (e.key === "ArrowUp" && i > 0) { e.preventDefault(); select(i - 1, false); ol.children[i - 1].focus(); }
      });
      ol.appendChild(li);
    });
  }

  function portrait(t) {
    var initial = h("div", { class: "initial", "aria-hidden": "true", text: (t.name || "?").charAt(0) });
    if (!/^https:\/\//.test(t.image || "")) return initial;
    var img = h("img", { class: "photo", src: t.image, alt: t.name + " 사진", width: "180", height: "180", loading: "lazy" });
    img.addEventListener("error", function () { img.replaceWith(initial); });
    return img;
  }

  function renderStory() {
    var box = document.getElementById("story");
    box.textContent = "";
    var t = teams[selected];
    if (!t) { box.appendChild(h("p", { text: "데이터가 없습니다. scripts/build_design_mocks.py 를 실행하세요." })); return; }
    var s = sentences(t);
    box.appendChild(h("div", { class: "kicker", text: ["후보 " + t.rank + "위", t.genre, t.status].filter(Boolean).join(" · ") }));
    box.appendChild(h("h2", { class: "headline", text: t.name }));
    box.appendChild(h("p", { class: "deck", text: s.slice(0, 2).join(" ") || "아직 기록이 적은 팀이다." }));
    var info = [["점수", fmt(t.score) + "점 (후보 " + comma(DATA.pool_size) + "팀 중 " + t.rank + "위)"], ["첫 포착", t.first_seen]];
    if (t.first_release) info.push(["첫 발매", t.first_release]);
    if (t.agency) info.push(["소속", t.agency]);
    info.push(["최근 활동", t.last_seen]);
    var dl = h("dl");
    info.forEach(function (r) { dl.appendChild(h("dt", { text: r[0] })); dl.appendChild(h("dd", { text: r[1] })); });
    var rest = s.slice(2).join(" ");
    box.appendChild(h("div", { class: "lead" }, [portrait(t), h("div", { class: "byline" }, [dl, rest ? h("p", { text: rest }) : null])]));

    box.appendChild(h("h3", { class: "sub", text: "점수는 어떻게 나왔나" }));
    var ul = h("ul", { class: "leaders" });
    t.parts.forEach(function (p, k) {
      var c = comps[k] || { label: p.key, desc: "" };
      ul.appendChild(h("li", { class: p.pts ? "" : "off", title: c.desc }, [
        h("span", { class: "lb" }, [document.createTextNode(c.label), h("small", { text: p.raw })]),
        h("span", { class: "dots" }), h("span", { class: "v", text: p.pts ? fmt(p.pts) : "—" })
      ]));
    });
    ul.appendChild(h("li", { class: "total" }, [h("span", { class: "lb", text: "합계" }), h("span", { class: "dots" }), h("span", { class: "v", text: fmt(t.score) })]));
    box.appendChild(ul);

    box.appendChild(h("h3", { class: "sub", text: "최근의 기록" }));
    box.appendChild(h("ol", { class: "chrono" }, (t.events || []).map(function (e) {
      return h("li", {}, [h("time", { datetime: e.date, text: e.date.replace(/-/g, ".") }), h("span", {}, [document.createTextNode(e.label), h("small", { text: e.branch })])]);
    })));
    box.appendChild(h("p", { class: "colophon", text: "시안용 화면 — " + DATA.as_of + " 실제 데이터로 그렸다. 문장은 점수 근거 숫자에서 자동으로 만든다." }));
  }

  function select(i, scroll) {
    selected = i;
    Array.prototype.forEach.call(document.getElementById("chart").children, function (li, k) {
      li.setAttribute("aria-selected", k === i ? "true" : "false");
    });
    renderStory();
    if (scroll && window.matchMedia("(max-width: 900px)").matches) {
      document.getElementById("story").scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }

  var themeBtn = document.getElementById("theme");
  function themeLabel() { themeBtn.textContent = document.documentElement.getAttribute("data-theme") === "dark" ? "화이트 모드" : "블랙 모드"; }
  themeBtn.addEventListener("click", function () {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("gigle-mock-theme", next); } catch (e) { /* 저장 못 해도 화면은 바뀜 */ }
    themeLabel();
  });
  themeLabel();
  document.getElementById("dateline").textContent = DATA.as_of ? longDate(DATA.as_of) + " · 후보 " + comma(DATA.pool_size) + "팀 중 상위 10" : "";
  renderChart();
  renderStory();
})();
</script>
