<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crate Digger — 국내 신인 발굴 분석 앱</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="app/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
</head>
<body>
  <div class="nav-backdrop" id="navBackdrop"></div>

  <div class="app-shell">
    <aside class="nav-rail" id="navRail" aria-label="화면 이동">
      <div class="nav-brand">
        <p class="nav-brand-title">Crate Digger</p>
        <p class="nav-brand-sub">국내 신인 발굴 분석 도구</p>
      </div>

      <nav class="nav-list">
        <div class="nav-group-label">발굴 · 추적</div>
        <a class="nav-link active" href="#/today" data-route="today"><span>오늘 볼 것</span></a>
        <a class="nav-link" href="#/candidates" data-route="candidates"><span>후보 탐색</span></a>
        <a class="nav-link" href="#/team" data-route="team"><span>팀 상세</span></a>
        <a class="nav-link" href="#/watchlist" data-route="watchlist">
          <span>관심 목록</span>
          <span class="nav-count" id="navWatchCount"></span>
        </a>

        <div class="nav-group-label">점수 · 신호 검증</div>
        <a class="nav-link" href="#/backtest" data-route="backtest">
          <span>점수 검증 (백테스트)</span>
          <span class="nav-count" id="navWeightBadge"></span>
        </a>
        <a class="nav-link" href="#/signals" data-route="signals"><span>신호별 적중률</span></a>
        <a class="nav-link" href="#/evidence" data-route="evidence"><span>검증 근거 (리드타임·연차)</span></a>

        <div class="nav-group-label">현황 · 탐색</div>
        <a class="nav-link" href="#/venues" data-route="venues"><span>씬 지도 (공연장)</span></a>
        <a class="nav-link" href="#/quality" data-route="quality"><span>데이터 현황 · 품질</span></a>
        <a class="nav-link" href="#/sql" data-route="sql"><span>SQL 직접 실행</span></a>
      </nav>

      <div class="nav-foot">
        <div id="navDataMeta">데이터 불러오는 중...</div>
        <div class="nav-foot-links">
          <a href="./">진행판</a>
          <a href="https://github.com/leegmyung/crate-digger/blob/main/docs/glossary.md" target="_blank" rel="noopener noreferrer">용어 정리</a>
          <a href="https://github.com/leegmyung/crate-digger/blob/main/docs/sql/README.md" target="_blank" rel="noopener noreferrer">SQL 문서</a>
        </div>
      </div>
    </aside>

    <div class="app-right">
      <header class="top-header">
        <div class="top-row">
          <div class="top-row-left">
            <button type="button" class="btn mobile-menu-btn" id="mobileMenuBtn" aria-label="메뉴 열기">메뉴</button>
            <span class="top-status" id="topStatus">DuckDB-WASM 초기화 중...</span>
          </div>
          <div class="top-row-right">
            <button type="button" class="btn" id="btnGlobalReset">초기화</button>
            <button type="button" class="btn" id="btnCopyLink">링크 복사</button>
            <button type="button" class="btn" id="themeToggle">다크 모드</button>
          </div>
        </div>

        <div class="filter-bar" id="globalFilterBar" aria-label="전역 필터">
          <div class="f-item">
            <label for="gfGenre">장르</label>
            <select id="gfGenre" class="select">
              <option value="">전체 장르</option>
            </select>
          </div>

          <div class="f-item">
            <label>갈래</label>
            <div class="f-branches" id="gfBranches"></div>
          </div>

          <div class="f-item">
            <label for="gfPeriod">기간</label>
            <select id="gfPeriod" class="select">
              <option value="0">전체 (3년)</option>
              <option value="30">최근 30일</option>
              <option value="90">최근 90일</option>
              <option value="180">최근 180일</option>
              <option value="365">최근 365일</option>
            </select>
          </div>

          <div class="f-item">
            <label for="gfNewcomer">신인(년)</label>
            <input type="number" id="gfNewcomer" class="input input-num" min="1" max="15" value="3">
          </div>

          <label class="f-check">
            <input type="checkbox" id="gfExcludeFamous" checked>
            <span>유명 팀 제외</span>
          </label>

          <div class="f-search-wrap">
            <input type="search" id="gfTeamSearch" class="f-search-input" placeholder="팀 검색 후 상세로 이동..." autocomplete="off">
            <div class="f-search-drop" id="gfTeamDrop" hidden></div>
          </div>
        </div>
      </header>

      <main class="view-main">
        <div id="globalError" class="notice notice-err" hidden></div>
        <div id="viewRoot">
          <div class="block">
            <p class="muted" style="margin:0;">데이터와 브라우저 SQL 엔진(DuckDB-WASM)을 불러오는 중입니다...</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="app/app.js"></script>
</body>
</html>
